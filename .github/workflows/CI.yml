name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  PYTHON: python
  CONDA_JL_HOME: ""
  MPLBACKEND: Agg
  JULIA_PKG_PRECOMPILE_AUTO: "0"

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install matplotlib

      # Purge runner cache paths before restoring to guarantee clean state
      - name: Wipe runner cache directories
        run: |
          rm -rf ~/.julia/compiled
          rm -rf ~/.julia/scratchspaces
          rm -rf ~/.julia/prefs
          rm -rf ~/.julia/conda

      - uses: julia-actions/cache@v2

      # Clean restored cache artifacts that retain hardcoded runner paths
      - name: Purge corrupt precompiled artifacts
        run: |
          rm -rf ~/.julia/compiled
          rm -rf ~/.julia/scratchspaces
          rm -rf ~/.julia/prefs
          rm -rf ~/.julia/conda

      - uses: julia-actions/julia-buildpkg@v1

      - name: Rebuild PyCall and fresh precompile
        shell: julia --project=@. --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
          
          # Force PyCall build against setup-python
          deps = Pkg.dependencies()
          pycall_pkg = filter(p -> p.second.name == "PyCall", deps)
          if !isempty(pycall_pkg)
              pycall_uuid = first(keys(pycall_pkg))
              Pkg.build(Pkg.PackageSpec(uuid=pycall_uuid))
          end
          
          # Force clean precompilation
          Pkg.precompile()

      - uses: julia-actions/julia-runtest@v1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install matplotlib

      - name: Purge runner cache directories
        run: |
          rm -rf ~/.julia/compiled
          rm -rf ~/.julia/scratchspaces
          rm -rf ~/.julia/prefs
          rm -rf ~/.julia/conda

      - uses: julia-actions/cache@v2

      - name: Purge corrupt precompiled artifacts
        run: |
          rm -rf ~/.julia/compiled
          rm -rf ~/.julia/scratchspaces
          rm -rf ~/.julia/prefs
          rm -rf ~/.julia/conda

      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
          
          deps = Pkg.dependencies()
          pycall_pkg = filter(p -> p.second.name == "PyCall", deps)
          if !isempty(pycall_pkg)
              pycall_uuid = first(keys(pycall_pkg))
              Pkg.build(Pkg.PackageSpec(uuid=pycall_uuid))
          end
          
          Pkg.precompile()

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}

      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using MicroFloatingPoints
          DocMeta.setdocmeta!(MicroFloatingPoints, :DocTestSetup, :(using MicroFloatingPoints, MicroFloatingPoints.MFPRandom, MicroFloatingPoints.MFPPlot, MicroFloatingPoints.MFPUtils); recursive=true)
          doctest(MicroFloatingPoints)